<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pattal Pride🔥🔥</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Comic Neue', cursive;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            position: relative;
            padding: 20px 0;
        }

        .bg-shapes {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 0;
            pointer-events: none;
        }

        .shape {
            position: absolute;
            opacity: 0.35;
            animation: float 7s ease-in-out infinite;
        }

        .shape:nth-child(1) { top: 8%; left: 5%; font-size: 3rem; animation-delay: 0s; }
        .shape:nth-child(2) { top: 15%; right: 10%; font-size: 2.8rem; animation-delay: 1.2s; }
        .shape:nth-child(3) { top: 45%; left: 3%; font-size: 3.2rem; animation-delay: 0.8s; }
        .shape:nth-child(4) { top: 55%; right: 6%; font-size: 2.5rem; animation-delay: 2.5s; }
        .shape:nth-child(5) { bottom: 10%; left: 12%; font-size: 3rem; animation-delay: 4s; }
        .shape:nth-child(6) { bottom: 25%; right: 18%; font-size: 2.7rem; animation-delay: 3.2s; }
        .shape:nth-child(7) { top: 35%; left: 50%; font-size: 2.6rem; animation-delay: 1.8s; }
        .shape:nth-child(8) { top: 75%; right: 25%; font-size: 3.1rem; animation-delay: 2.8s; }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-25px) rotate(12deg); }
        }

        .main-container {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 20px;
            max-width: 900px;
            width: 100%;
        }

        .logo-circle {
            width: 120px;
            height: 120px;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 30px;
            font-size: 3.5rem;
            border: 3px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .hero-title {
            font-family: 'Fredoka', sans-serif;
            font-size: clamp(2.2rem, 7vw, 4.2rem);
            font-weight: 700;
            color: #fff;
            text-shadow: 3px 3px 0px rgba(0, 0, 0, 0.2), 6px 6px 0px rgba(0, 0, 0, 0.1);
            margin-bottom: 10px;
            animation: bounce 2s ease-in-out infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        .subtitle {
            font-size: clamp(1.1rem, 2.5vw, 1.6rem);
            color: rgba(255, 255, 255, 0.95);
            margin-bottom: 40px;
            opacity: 0.95;
            font-weight: 600;
            font-style: italic;
        }

        .members-section {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border-radius: 25px;
            padding: 30px 20px;
            margin-bottom: 35px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
        }

        .members-title {
            font-family: 'Fredoka', sans-serif;
            font-size: 1.8rem;
            color: #fff;
            margin-bottom: 25px;
            text-shadow: 2px 2px 0px rgba(0, 0, 0, 0.1);
        }

        .members-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
        }

        .member-card {
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(5px);
            padding: 15px 25px;
            border-radius: 50px;
            border: 2px solid rgba(255, 255, 255, 0.4);
            transition: all 0.3s ease;
            cursor: default;
            min-width: 120px;
        }

        .member-card:hover {
            transform: translateY(-5px) scale(1.05);
            background: rgba(255, 255, 255, 0.4);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        }

        .member-avatar {
            font-size: 2rem;
            margin-bottom: 5px;
        }

        .member-name {
            font-family: 'Fredoka', sans-serif;
            font-size: 1rem;
            font-weight: 700;
            color: #fff;
            text-shadow: 1px 1px 0px rgba(0, 0, 0, 0.1);
        }

        .btn-open {
            font-family: 'Fredoka', sans-serif;
            font-size: 1.3rem;
            padding: 20px 50px;
            background: white;
            color: #764ba2;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
            transition: all 0.3s ease;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            position: relative;
            overflow: hidden;
        }

        .btn-open:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.35);
            background: #f0e6ff;
        }

        .btn-open:active {
            transform: translateY(-2px) scale(1.02);
        }

        .btn-open::before {
            content: '📚';
            position: absolute;
            left: 22px;
            animation: sparkle 1.5s ease-in-out infinite;
        }

        .btn-open::after {
            content: '💜';
            position: absolute;
            right: 22px;
            animation: sparkle 1.5s ease-in-out infinite 0.5s;
        }

        @keyframes sparkle {
            0%, 100% { opacity: 0.4; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.65);
            z-index: 1000;
            animation: fadeIn 0.3s ease;
            backdrop-filter: blur(8px);
            align-items: center;
            justify-content: center;
        }

        .modal-overlay.active {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-content {
            background: linear-gradient(135deg, #a18cd1, #fbc2eb, #f6d365);
            padding: 45px 35px;
            border-radius: 30px;
            max-width: 650px;
            width: 90%;
            position: relative;
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.35);
            animation: slideUp 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            border: 5px solid white;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(50px) scale(0.8);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .modal-emoji {
            font-size: 4.5rem;
            margin-bottom: 20px;
            animation: wiggle 1s ease-in-out infinite;
        }

        @keyframes wiggle {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(-10deg); }
            75% { transform: rotate(10deg); }
        }

        .modal-text {
            font-family: 'Fredoka', sans-serif;
            font-size: clamp(1.5rem, 4vw, 2.4rem);
            color: #4a148c;
            font-weight: 700;
            line-height: 1.4;
            margin-bottom: 30px;
            min-height: 90px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .modal-nav {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
        }

        .btn-nav {
            font-family: 'Fredoka', sans-serif;
            font-size: 1rem;
            padding: 12px 28px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 700;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-nav:hover {
            transform: scale(1.1) translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.6);
            background: linear-gradient(135deg, #764ba2, #667eea);
        }

        .btn-close {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 2.2rem;
            background: rgba(255, 255, 255, 0.3);
            border: none;
            cursor: pointer;
            color: #4a148c;
            font-weight: bold;
            width: 45px;
            height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
        }

        .btn-close:hover {
            background: rgba(255, 255, 255, 0.6);
            transform: rotate(90deg);
        }

        .counter {
            font-family: 'Fredoka', sans-serif;
            font-size: 0.9rem;
            color: #4a148c;
            opacity: 0.7;
            margin-top: 10px;
            font-weight: 600;
        }

        .fade-in {
            animation: fadeInText 0.5s ease;
        }

        @keyframes fadeInText {
            from { opacity: 0; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1); }
        }

        .sparkle {
            position: absolute;
            font-size: 1.6rem;
            animation: sparkle-fall 3s linear infinite;
        }

        @keyframes sparkle-fall {
            0% {
                transform: translateY(-100px) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(100vh) rotate(360deg);
                opacity: 0;
            }
        }

        @media (max-width: 600px) {
            .member-card {
                min-width: 100px;
                padding: 12px 18px;
            }
            .member-avatar {
                font-size: 1.6rem;
            }
            .member-name {
                font-size: 0.9rem;
            }
            .members-title {
                font-size: 1.4rem;
            }
        }
    </style>
</head>
<body>
    <div class="bg-shapes">
        <div class="shape">📚</div>
        <div class="shape">🎓</div>
        <div class="shape">✏️</div>
        <div class="shape">👭</div>
        <div class="shape">💜</div>
        <div class="shape">📝</div>
        <div class="shape">💖</div>
        <div class="shape">🎒</div>
    </div>

    <div class="main-container">
        <div class="logo-circle">🏫</div>
        <h1 class="hero-title">Pattal Pride 💜</h1>
        <p class="subtitle">Persahabatan sejati dimulai dari kampus! 🌸</p>

        <div class="members-section">
            <h2 class="members-title">Anggota Circle Kami 💜</h2>
            <div class="members-grid">
                <div class="member-card">
                    <div class="member-avatar">👑</div>
                    <div class="member-name">Rezaa</div>
                </div>
                <div class="member-card">
                    <div class="member-avatar">🔥</div>
                    <div class="member-name">Achyar</div>
                </div>
                <div class="member-card">
                    <div class="member-avatar">🌸</div>
                    <div class="member-name">Arnita</div>
                </div>
                <div class="member-card">
                    <div class="member-avatar">💫</div>
                    <div class="member-name">Milda</div>
                </div>
                <div class="member-card">
                    <div class="member-avatar">🦋</div>
                    <div class="member-name">Inaya</div>
                </div>
                <div class="member-card">
                    <div class="member-avatar">🎀</div>
                    <div class="member-name">Sasa</div>
                </div>
                <div class="member-card">
                    <div class="member-avatar">⚡</div>
                    <div class="member-name">Eki</div>
                </div>
            </div>
        </div>

        <button class="btn-open" onclick="openModal()">
            Buka Kata Persahabatan ✨
        </button>
    </div>

    <!-- MODAL -->
    <div class="modal-overlay" id="modalOverlay" onclick="closeModalOnOverlay(event)">
        <div class="modal-content" id="modalContent">
            <button class="btn-close" onclick="closeModal()">&times;</button>
            <div class="modal-emoji" id="modalEmoji">📚</div>
            <div class="modal-text fade-in" id="modalText">Kamu teman terbaik aku!</div>
            <div class="modal-nav">
                <button class="btn-nav" onclick="prevQuote()">← Sebelumnya</button>
                <button class="btn-nav" onclick="nextQuote()">Selanjutnya →</button>
            </div>
            <div class="counter" id="counter">1 / 25</div>
        </div>
    </div>

    <script>
        const quotes = [
            { text: "Pattal Pride selamanya! 💜🔥", emoji: "💜" },
            { text: "Yang keluar grup denda 200Ribu nahhhh 😂", emoji: "😂" },
            { text: "Pattal Pride Gass Bilyard! 🚀", emoji: "🚀" },
            { text: "Lulus bareng, cita-cita bareng, sukses bareng! 🙌", emoji: "🙌" },
            { text: "Info Isi KRS Gesss!", emoji: "📝" },
            // { text: "Rezaa selalu jadi minimalist yanginspiratif! 🌟", emoji: "🌟" },
            // { text: "Achyar yang bikin suasana selalu ceria! 🔥", emoji: "🔥" },
            // { text: "Arnita, sosok gentle yang bikin semua nyaman! 🌸", emoji: "🌸" },
            // { text: "Milda selalu ada buatngobrolin everything! 💫", emoji: "💫" },
            // { text: "Inaya, creative thinker kita! 🦋", emoji: "🦋" },
            // { text: "Sasa yang bikin hari-hari lebih warna-warni! 🎀", emoji: "🎀" },
            // { text: "Eki yang energy nya always di atas! ⚡", emoji: "⚡" },
            // { text: "Kita 7 orang, satu hati, satu tujuan! 💜", emoji: "💜" },
            // { text: "Makasih udah jadi keluarga di kampus! 🏫", emoji: "🏫" },
            // { text: "Bertemu kalian adalah takdir terbaik! ✨", emoji: "✨" },
            // { text: "Kita bukan sekadar teman, kita adalah tim! 🤝", emoji: "🤝" },
            { text: "Pattal Pride: dari Rezaa, Achyar, Arnita, Milda, Inaya, Sasa, dan Eki! 💕", emoji: "💕" },
            // { text: "Jangan lupa kalau kita ada untuk satu sama lain! 🤗", emoji: "🤗" },
            // { text: "Kampus ini tak akan sama tanpa kalian! 🌈", emoji: "🌈" },
            // { text: "Keep shining, Pattal Pride! 🌟", emoji: "🌟" },
            // { text: "Selfie sesama Pattal Pride di sudut mana pun! 📸", emoji: "📸" },
            // { text: "Makasih untuk semua cerita dan tawa bareng! 😂", emoji: "😂" },
            // { text: "Kita adalah keluarga pilihan sejati! 🏠", emoji: "🏠" },
            // { text: "Setiap hari di kampus lebih berarti dengan kalian! 💖", emoji: "💖" },
            // { text: "Pattal Pride, our forever circle! 💜✨", emoji: "✨" }
        ];

        let currentIndex = 0;

        function openModal() {
            document.getElementById('modalOverlay').classList.add('active');
            updateQuote();
        }

        function closeModal() {
            document.getElementById('modalOverlay').classList.remove('active');
        }

        function closeModalOnOverlay(event) {
            if (event.target === document.getElementById('modalOverlay')) {
                closeModal();
            }
        }

        function updateQuote() {
            const quote = quotes[currentIndex];
            const textEl = document.getElementById('modalText');
            const emojiEl = document.getElementById('modalEmoji');
            const counterEl = document.getElementById('counter');

            textEl.classList.remove('fade-in');
            void textEl.offsetWidth;
            textEl.classList.add('fade-in');

            textEl.textContent = quote.text;
            if (quote.emoji) {
                emojiEl.textContent = quote.emoji;
                emojiEl.style.display = 'block';
            } else {
                emojiEl.style.display = 'none';
            }
            counterEl.textContent = `${currentIndex + 1} / ${quotes.length}`;
        }

        function nextQuote() {
            currentIndex = (currentIndex + 1) % quotes.length;
            updateQuote();
        }

        function prevQuote() {
            currentIndex = (currentIndex - 1 + quotes.length) % quotes.length;
            updateQuote();
        }

        document.addEventListener('keydown', (e) => {
            const modal = document.getElementById('modalOverlay');
            if (!modal.classList.contains('active')) return;

            if (e.key === 'Escape') closeModal();
            if (e.key === 'ArrowRight') nextQuote();
            if (e.key === 'ArrowLeft') prevQuote();
        });

        function createSparkles() {
            const container = document.querySelector('.bg-shapes');
            const sparkleEmojis = ['✨', '💜', '⭐', '🤝', '📚', '💖'];
            for (let i = 0; i < 15; i++) {
                const sparkle = document.createElement('div');
                sparkle.className = 'sparkle';
                sparkle.textContent = sparkleEmojis[Math.floor(Math.random() * sparkleEmojis.length)];
                sparkle.style.left = Math.random() * 100 + '%';
                sparkle.style.animationDelay = Math.random() * 3 + 's';
                sparkle.style.animationDuration = (Math.random() * 3 + 2) + 's';
                container.appendChild(sparkle);
            }
        }

        createSparkles();
    </script>
</body>
</html>
